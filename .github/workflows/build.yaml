name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  binaries:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build builder image (cached FFmpeg layer)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.builder
          platforms: ${{ matrix.platform }}
          load: true
          tags: scrcpy-rfb-builder:${{ matrix.arch }}
          build-args: |
            UBUNTU_PORTS_MIRROR=http://mirror.us.leaseweb.net/ubuntu-ports
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}

      - name: Build Ubuntu 22.04 binary and run self-test
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD:/src" \
            "scrcpy-rfb-builder:${{ matrix.arch }}"

      - name: Verify artifact architecture and dependencies
        run: |
          artifact="dist/scrcpy-rfb-linux-${{ matrix.arch }}"
          file "$artifact"
          test -x "$artifact"
          grep -F "scrcpy-rfb-linux-${{ matrix.arch }}" "$artifact.sha256"

      - name: Build su1000 helper (runs the scrcpy server as the system uid)
        run: |
          # The builder container writes dist/ as root; take it back so gcc (runner user) can write.
          sudo chown -R "$(id -u):$(id -g)" dist
          su1000="dist/su1000-linux-${{ matrix.arch }}"
          gcc -static -O2 -s -o "$su1000" server/su1000.c
          file "$su1000"
          ( cd dist && sha256sum "su1000-linux-${{ matrix.arch }}" > "su1000-linux-${{ matrix.arch }}.sha256" )

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: part-scrcpy-rfb-linux-${{ matrix.arch }}
          path: |
            dist/scrcpy-rfb-linux-${{ matrix.arch }}
            dist/scrcpy-rfb-linux-${{ matrix.arch }}.sha256
            dist/su1000-linux-${{ matrix.arch }}
            dist/su1000-linux-${{ matrix.arch }}.sha256

  server:
    name: Build patched scrcpy-server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build patched scrcpy-server (secure FLAG_SECURE mirror)
        run: |
          mkdir dist
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends smali default-jre-headless python3 unzip zip
          curl -fsSL https://github.com/Genymobile/scrcpy/releases/download/v4.1/scrcpy-server-v4.1 \
            -o dist/scrcpy-server-secure.jar
          echo "deacb991ed2509715160ffdc7907e47b4160eb30d1566217e9047fd5b8850cae  dist/scrcpy-server-secure.jar" | sha256sum -c -
          cp dist/scrcpy-server-secure.jar dist/scrcpy-server.jar
          bash server/patch-scrcpy-secure.sh dist/scrcpy-server-secure.jar
          ( cd dist && sha256sum scrcpy-server-secure.jar > scrcpy-server-secure.jar.sha256 \
            && sha256sum scrcpy-server.jar > scrcpy-server.jar.sha256 )

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: part-scrcpy-server
          path: |
            dist/scrcpy-server-secure.jar
            dist/scrcpy-server-secure.jar.sha256
            dist/scrcpy-server.jar
            dist/scrcpy-server.jar.sha256

  dist:
    name: Assemble dist
    needs: [binaries, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: part-*
          path: dist
          merge-multiple: true

      - name: Add provenance and checksums
        run: |
          set -euo pipefail
          ffmpeg_commit=$(sed -n 's/^ARG FFMPEG_COMMIT=//p' docker/Dockerfile.builder)
          cat > dist/build-info.json <<INFO
          {
            "ref": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "workflow": "${GITHUB_WORKFLOW}",
            "ffmpeg_commit": "${ffmpeg_commit}"
          }
          INFO
          (cd dist && find . -type f -not -name SHA256SUMS | sort | xargs sha256sum > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
