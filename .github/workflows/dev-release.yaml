name: Build and Release Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yaml

  release:
    name: Update dev prerelease
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Create dev release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Dev Build
          body: |
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Workflow Run: `${{ github.run_id }}`
          files: dist/*
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move dev tag to current commit
        run: |
          git tag -f dev "${GITHUB_SHA}"
          git push origin refs/tags/dev --force

  docker:
    name: Push container image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Make binaries executable
        run: chmod +x dist/scrcpy-rfb-linux-*

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UBUNTU_PORTS_MIRROR=http://mirror.us.leaseweb.net/ubuntu-ports
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ github.sha }}
